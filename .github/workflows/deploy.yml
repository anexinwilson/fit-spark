name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: docker build --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" -t "${{ secrets.GCP_IMAGE_BASE_URL }}:${{ github.sha }}" .

      - name: Push Docker image
        run: docker push "${{ secrets.GCP_IMAGE_BASE_URL }}:${{ github.sha }}"

      # Terraform owns service configuration; CI changes only the image.
      - name: Update Cloud Run image
        run: |
          if gcloud run services describe "${{ secrets.GCP_CLOUD_RUN_SERVICE }}" --region "${{ secrets.GCP_REGION }}" --project "${{ secrets.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud run services update "${{ secrets.GCP_CLOUD_RUN_SERVICE }}" \
              --image "${{ secrets.GCP_IMAGE_BASE_URL }}:${{ github.sha }}" \
              --region "${{ secrets.GCP_REGION }}" \
              --project "${{ secrets.GCP_PROJECT_ID }}" \
              --quiet
          else
            echo "Image pushed. Apply Terraform with deploy_cloud_run=true for the first Cloud Run deployment."
          fi

      - name: Deployment completed
        run: echo "GitHub Actions deployment workflow completed."

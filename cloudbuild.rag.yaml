steps:
  - id: Build RAG ingestion image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - Dockerfile.rag
      - --tag
      - ${_IMAGE_URI}
      - .

images:
  - ${_IMAGE_URI}

serviceAccount: projects/${PROJECT_ID}/serviceAccounts/fit-spark-build@${PROJECT_ID}.iam.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
